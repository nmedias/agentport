# Netlify deploy: publish the @agentport/ui Storybook as the DS site.

[build]
  # Repo root, not libs/ui - npm workspaces need the root package.json,
  # and `publish` below is resolved relative to this base.
  base = "/"
  command = "npm run build-storybook"
  publish = "libs/ui/storybook-static"

[build.environment]
  NODE_VERSION = "24"
  # No Nx daemon in CI containers.
  NX_DAEMON = "false"

# Storybook is a static SPA-ish site with real files; only the
# hashed assets are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
